name: AI Model Validation Audit

on: [push, pull_request]

jobs:
  validate_localization:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai_model

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: '' 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../testing/requirements.txt

      - name: Feature Extraction
        run: python preprocess.py

      - name: SVM Training & Model Generation
        run: python model.py

      - name: 36-Combination System Audit
        run: python test.py 

      - name: Logic Unit Testing
        run: pytest test_model_requirements.py

      - name: Upload AI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-validation-results
          path: |
            ai_model/models.pkl
            ai_model/features_dataset.csv
