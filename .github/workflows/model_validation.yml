name: AI Model Validation Audit

on: [push, pull_request]

jobs:
  validate_localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r testing/requirements.txt

      - name: Feature Extraction
        run: python ai_model/preprocess.py

      - name: SVM Training & Evaluation
        run: python ai_model/model.py

      - name: 36-Combination System Audit
        run: python ai_model/test.py 

      - name: Generate AI Model Weights
        run: python ai_model/train.py  # FIX: Trains the model to generate the missing models.pkl file

      - name: Logic Unit Testing
        run: pytest ai_model/test_model_requirements.py

      - name: Upload AI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-validation-results
          path: |
            models.pkl
            features_dataset.csv
