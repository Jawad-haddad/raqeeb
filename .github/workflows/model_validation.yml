name: AI Model Validation Audit

on: [push, pull_request]

jobs:
  validate_localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Uses your requirements.txt with scikit-learn 1.8.0
        run: |
          pip install -r requirements.txt

      - name: # Step 1: Feature Extraction
        # Processes your 4 rounds into 25 features
        run: python preprocess.py 

      - name: # Step 2: SVM Training & Evaluation
        # Performs 75/25 temporal split and trains the SVM
        run: python model.py 

      - name: # Step 3: 36-Combination System Audit
        # Tests all 12 blocks × 3 conditions automatically
        run: python test.py 

      - name: # Step 4: Logic Unit Testing
        # Fails the build if your average accuracy drops below 82.2%
        run: pytest ai_model/test_model_requirements.py
