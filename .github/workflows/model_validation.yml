name: AI Model Validation Audit

on: [push, pull_request]

jobs:
  validate_localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r testing/requirements.txt

      - name: Feature Extraction
        working-directory: ./ai_model
        run: python preprocess.py

      - name: SVM Training & Model Generation
        working-directory: ./ai_model
        run: python model.py

      # Dynamic File Path Syncer & Debugger
      - name: Verify and Link Generated Model Artifacts
        run: |
          echo "=== Scanning Workspace For Generated Files ==="
          if [ -f models.pkl ]; then
            echo "Found models.pkl in root directory. Syncing to ai_model folder..."
            cp models.pkl ai_model/models.pkl
          elif [ -f ai_model/models.pkl ]; then
            echo "Found models.pkl natively inside ai_model folder."
            cp ai_model/models.pkl ./
          else
            echo "Warning: models.pkl not detected in standard paths yet. Printing workspace map:"
            ls -R
          fi

      - name: 36-Combination System Audit
        working-directory: ./ai_model
        run: python test.py 

      - name: Logic Unit Testing
        working-directory: ./ai_model
        run: pytest test_model_requirements.py

      - name: Upload AI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-validation-results
          path: |
            models.pkl
            features_dataset.csv
            ai_model/models.pkl
            ai_model/features_dataset.csv
