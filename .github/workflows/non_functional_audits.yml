name: Non-Functional Testing Pipeline
on: [push, pull_request]

jobs:
  # SECURITY
  security_audit:
    name: Snyk Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r testing/requirements.txt

      - name: Run Snyk Open Source Security Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          # FIX: Separate arguments line-by-line so they parse as distinct Docker parameters
          args: >
            --file=testing/requirements.txt
            --skip-unresolved=true

  # PERFORMANCE & SPEED TESTING
  speed_audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-lighthouse-${{ hashFiles('package-lock.json') || 'v2' }}

      
      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm install lighthouse puppeteer

        
      - name: Ensure Chromium Binary is Installed
        run: npx puppeteer browsers install chrome


      - name: Run Audit Script
        env:
          EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          PASSWORD: ${{ secrets.TEST_USER_PASS }}
        run: |
          cat << 'EOF' > lighthouse-auth.js
          const puppeteer = require('puppeteer');
          const { startFlow } = require('lighthouse');
          const fs = require('fs');

          (async () => {
            // Puppeteer automatically targets its self-bundled browser instance safely
            const browser = await puppeteer.launch({
              headless: "new",
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            
            try {
              const flow = await startFlow(page, {
                name: 'Raqeeb Dashboard Audit',
                configContext: { settings: { screenEmulation: { disabled: true } } }
              });

              console.log('Step 1: Navigating to landing portal...');
              await page.goto('https://gradversion2.netlify.app/', { waitUntil: 'domcontentloaded' });
              
              console.log('Step 2: Authenticating User...');
              await page.waitForSelector('input[type="email"]', { timeout: 15000 });
              await page.type('input[type="email"]', process.env.EMAIL);
              await page.type('input[type="password"]', process.env.PASSWORD);
              await page.click('.login-button');
              
              console.log('Step 3: Rendering Protected Dashboard Controls...');
              await page.waitForSelector('.dashboard-sidebar', { visible: true, timeout: 25000 });
              
              console.log('Step 4: Compiling Core Web Vitals Flow Metrics...');
              await flow.snapshot({ stepName: 'Dashboard Post-Login' });

              const report = await flow.generateReport();
              fs.writeFileSync('lh-report.html', report);
              console.log('Performance audit output successfully captured.');

            } catch (error) {
              console.error('DIAGNOSTIC CRASH ENCOUNTERED:', error.message);
              await page.screenshot({ path: 'error-log.png', fullPage: true });
              process.exit(1); 
            } finally {
              await browser.close();
            }
          })();
          EOF
          node lighthouse-auth.js

      - name: Upload Audit Visuals & Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-performance-results
          path: |
            lh-report.html
            error-log.png

  # LOAD TESTING
  load_audit:
   name: JMeter Database Stress Test
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v4

    - name: Set up JRE Runtime
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache JMeter Binaries
      id: cache-jmeter
      uses: actions/cache@v4
      with:
        path: apache-jmeter-5.6.3
        key: jmeter-5.6.3-bin

    - name: Download JMeter Core Engine
      if: steps.cache-jmeter.outputs.cache-hit != 'true'
      run: |
        wget -q https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
        tar -xzf apache-jmeter-5.6.3.tgz

    - name: Add JMeter binaries to Execution PATH
      run: echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

    - name: Fetch Active Session ID
      id: get-session
      run: |
        SESSION_ID=$(curl -s \
          "${{ secrets.SUPABASE_URL }}/rest/v1/sessions?status=eq.active&select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['id']) if data else print('38cdfd18-18b4-4ed4-b788-0c660edf7226')")
        echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
        echo "Using session: $SESSION_ID"

    - name: Disable espData Trigger
      run: |
        curl -s -X POST \
          "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/exec_sql" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"query": "ALTER TABLE \"espData\" DISABLE TRIGGER on_espdata_insert;"}'
        echo "Trigger disabled"

    - name: Run JMeter Load Test Engine
      timeout-minutes: 3
      run: |
        jmeter -n -t testing/raqeeb_test_plan.jmx \
          -l results.jtl \
          -e -o ./reports/ \
          -Jsupabase_key="${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -Jsession_id="${{ steps.get-session.outputs.session_id }}" \
          -Djava.net.preferIPv4Stack=true

    - name: Re-enable espData Trigger
      if: always()
      run: |
        curl -s -X POST \
          "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/exec_sql" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"query": "ALTER TABLE \"espData\" ENABLE TRIGGER on_espdata_insert;"}'
        echo "Trigger re-enabled"

    - name: Upload JMeter Dashboard Metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-load-results
        path: |
          results.jtl
          reports/
